name: Sync Tip Ledger

# Durable snapshot of bridge tips → public/live-ledger.json (Pages).
# No Cloudflare secrets — only GITHUB_TOKEN + public ntfy host.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

concurrency:
  group: sync-tip-ledger
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Merge ntfy → live-ledger.json
        run: node scripts/merge-ntfy-ledger.mjs
        env:
          NTFY_BASE: https://ntfy.adminforge.de/kouvadeiros-tips-bridge-2026
      - name: Commit if changed
        run: |
          if git diff --quiet -- public/live-ledger.json; then
            echo "No ledger changes"
            exit 0
          fi
          git config user.name "kouvadeiros-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/live-ledger.json
          git commit -m "chore: sync tip ledger from bridge"
          git push
