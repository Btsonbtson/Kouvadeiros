name: Live Score Sync
on:
  schedule:
    # GitHub free tier: effective minimum ~every 5 minutes
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force fetch even outside live match window (for testing FDORG_TOKEN)'
        type: boolean
        default: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: |
          pip install requests python-dotenv boto3
          # SofaScore fallback uses Playwright when JSON API is blocked (403)
          pip install playwright
          python -m playwright install chromium
      - name: Check upload credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_R2_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          CF_R2_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
        run: |
          if [ -n "$CF_R2_ACCESS_KEY_ID" ] && [ -n "$CF_R2_SECRET_ACCESS_KEY" ] && [ -n "$CF_ACCOUNT_ID" ]; then
            echo "Upload path: R2 (S3 credentials configured)"
          elif [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CF_ACCOUNT_ID" ]; then
            echo "Upload path: KV (Cloudflare API token configured)"
          else
            echo "::error::Configure either R2 secrets (CF_ACCOUNT_ID + CF_R2_ACCESS_KEY_ID + CF_R2_SECRET_ACCESS_KEY) or KV secrets (CLOUDFLARE_API_TOKEN + CF_ACCOUNT_ID)."
            exit 1
          fi
      - name: Fetch + upload to R2
        # Skips automatically when no fixture is in 15′ warm-up → +200′ live window
        # Manual runs can pass force=true to test FDORG_TOKEN anytime
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" = "true" ]; then
            python scripts/upload_to_r2.py --force
          else
            python scripts/upload_to_r2.py
          fi
        env:
          FDO_API_KEY: ${{ secrets.FDORG_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_R2_BUCKET: ${{ secrets.CF_R2_BUCKET }}
          CF_R2_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          CF_R2_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
