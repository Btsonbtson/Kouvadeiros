name: Live Score Sync
on:
  schedule:
    # GitHub free tier: effective minimum ~every 5 minutes
    # Gate step skips instantly when today is not a ΠΡΟΓΡΑΜΜΑ game day
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force fetch even outside ΠΡΟΓΡΑΜΜΑ game-day / live window (for testing)'
        type: boolean
        default: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Gate — ΠΡΟΓΡΑΜΜΑ game day only
        id: gate
        env:
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force == true }}
        run: |
          ARGS=(--gate)
          if [ "$FORCE" = "true" ]; then
            ARGS+=(--force)
          fi
          OUT=$(python scripts/upload_to_r2.py "${ARGS[@]}")
          echo "$OUT"
          RUN=$(printf '%s\n' "$OUT" | sed -n 's/^run=//p' | head -1)
          REASON=$(printf '%s\n' "$OUT" | sed -n 's/^reason=//p' | head -1)
          echo "run=${RUN:-0}" >> "$GITHUB_OUTPUT"
          echo "reason=${REASON:-unknown}" >> "$GITHUB_OUTPUT"
          if [ "${RUN:-0}" != "1" ]; then
            echo "Skipping Cloudflare KV/R2 sync — ${REASON}"
          else
            echo "Proceeding — ${REASON}"
          fi
      - name: Install deps
        if: steps.gate.outputs.run == '1'
        run: |
          pip install requests python-dotenv boto3
          # SofaScore fallback uses Playwright when JSON API is blocked (403)
          pip install playwright
          python -m playwright install chromium
      - name: Check secrets
        id: creds
        if: steps.gate.outputs.run == '1'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_R2_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          CF_R2_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
          FDORG_TOKEN: ${{ secrets.FDORG_TOKEN }}
        run: |
          UPLOAD=0
          if [ -n "$CF_R2_ACCESS_KEY_ID" ] && [ -n "$CF_R2_SECRET_ACCESS_KEY" ] && [ -n "$CF_ACCOUNT_ID" ]; then
            echo "Upload path: R2"
            UPLOAD=1
          elif [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CF_ACCOUNT_ID" ]; then
            echo "Upload path: KV"
            UPLOAD=1
          else
            echo "::warning::No Cloudflare upload secrets — will fetch only (no R2/KV write)."
            echo "Add either CF_ACCOUNT_ID+CF_R2_* or CLOUDFLARE_API_TOKEN+CF_ACCOUNT_ID under repo Actions secrets."
          fi
          if [ -z "$FDORG_TOKEN" ]; then
            echo "::warning::FDORG_TOKEN secret missing — FDO may fail; Gazzetta still works (no key)."
          else
            echo "FDORG_TOKEN: present"
          fi
          echo "upload=$UPLOAD" >> "$GITHUB_OUTPUT"
      - name: Fetch (+ upload if configured)
        if: steps.gate.outputs.run == '1'
        # Skips automatically when no fixture is in 15′ warm-up → +200′ live window
        # Manual runs can pass force=true to test providers anytime
        run: |
          ARGS=()
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" = "true" ]; then
            ARGS+=(--force)
          fi
          if [ "${{ steps.creds.outputs.upload }}" != "1" ]; then
            ARGS+=(--fetch-only)
          fi
          python scripts/upload_to_r2.py "${ARGS[@]}"
        env:
          FDO_API_KEY: ${{ secrets.FDORG_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_R2_BUCKET: ${{ secrets.CF_R2_BUCKET }}
          CF_R2_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          CF_R2_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
