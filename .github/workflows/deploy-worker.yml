name: Deploy Worker

# Manual or push-to-main (worker paths / this file) deploys kouvadeiros-api.
on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - 'src/lib/data.js'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:
  repository_dispatch:
    types: [deploy-worker]

concurrency:
  group: deploy-worker
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Check Cloudflare credentials
        id: creds
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            {
              echo "## Worker deploy skipped — secrets not available yet"
              echo ""
              echo "Pages keeps the season running via \`SEEDED_PREDICTIONS\` + offline login fallback."
              echo "Add \`CLOUDFLARE_API_TOKEN\` + \`CF_ACCOUNT_ID\` when ready (after 31/8), then re-run this workflow."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::CLOUDFLARE_API_TOKEN / CF_ACCOUNT_ID missing — skipping Worker deploy (Pages fallback active)."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "CF_ACCOUNT_ID length: ${#CLOUDFLARE_ACCOUNT_ID}"
            echo "CLOUDFLARE_API_TOKEN length: ${#CLOUDFLARE_API_TOKEN}"
          fi
      - name: Deploy kouvadeiros-api
        if: steps.creds.outputs.skip != 'true'
        run: npx wrangler@4 deploy -c worker/wrangler-api.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      - name: Verify ping
        if: steps.creds.outputs.skip != 'true'
        run: |
          sleep 3
          curl -fsS 'https://kouvadeiros-api.jboikos.workers.dev/ping' | tee /tmp/ping.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/ping.json'))
          assert d.get('ok') is True, d
          assert d.get('bridge') is not True, f"this URL is answering as the bridge, not the Worker: {d}"
          version = d.get('version')
          assert isinstance(version, (int, float)) and version >= 13, f"Worker version {version} still has broken /login (CF 1101)"
          assert d.get('loginFixed') is True, f"Worker ping must advertise loginFixed:true: {d}"
          print('Worker OK version=', version, 'loginFixed=', d.get('loginFixed'))
          print('::notice::Run `node scripts/import-ledger-to-worker.mjs` once to migrate bridge-era tips into this Worker.')
          PY
