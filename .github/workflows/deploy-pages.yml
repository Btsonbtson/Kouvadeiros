name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Cloudflare Git integration can redeploy without a Vite build and serve
# /src/main.jsx (stuck on "Φορτώνει..."). This workflow always builds first.
concurrency:
  group: deploy-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Verify production entry
        run: |
          grep -q '/assets/index-' dist/index.html
          ! grep -q '/src/main.jsx' dist/index.html
      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy dist --project-name=kouvadeiros --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
