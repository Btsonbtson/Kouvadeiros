name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Cloudflare Git integration deploys on push (build: npm run build → dist).
# This workflow verifies every push serves a Vite bundle, not /src/main.jsx.
# Manual wrangler deploy only when workflow_dispatch (needs CLOUDFLARE_API_TOKEN).
concurrency:
  group: deploy-pages
  cancel-in-progress: true

jobs:
  verify:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Verify production entry
        run: |
          grep -q '/assets/index-' dist/index.html
          ! grep -q '/src/main.jsx' dist/index.html

  deploy:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Verify production entry
        run: |
          grep -q '/assets/index-' dist/index.html
          ! grep -q '/src/main.jsx' dist/index.html
      - name: Check Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            {
              echo "## Pages manual deploy blocked — missing secrets"
              echo ""
              echo "Add \`CLOUDFLARE_API_TOKEN\` and \`CF_ACCOUNT_ID\` under"
              echo "**Settings → Secrets and variables → Actions**."
              echo ""
              echo "Note: normal pushes already deploy via Cloudflare Git integration;"
              echo "this job is only for manual \`workflow_dispatch\`."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Add CLOUDFLARE_API_TOKEN and CF_ACCOUNT_ID in repo Settings → Secrets → Actions."
            exit 1
          fi
      - name: Deploy to Cloudflare Pages
        run: npx wrangler@4 pages deploy dist --project-name=kouvadeiros --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
